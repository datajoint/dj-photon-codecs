name: CD

# Pull requests and pushes to main build the package. A release is an annotated
# tag vX.Y.Z on main whose message is the release notes: pushing it checks the
# tag, publishes the package built at the tag (hatch-vcs takes the version from
# the tag), and creates the GitHub release with the tag's message as its notes.
#
# PyPI trusted publishing is bound to this file's name and to the pypi
# environment, so neither can be renamed without updating PyPI.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a build in progress; a release is never cancelled.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FORCE_COLOR: 3

jobs:
  dist:
    name: Distribution build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # v3 ships Twine 7, which understands packaging metadata 2.4/2.5 — what a
      # PEP 639 SPDX license declaration produces. v2 bundles Twine 6 and fails
      # `twine check --strict`.
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  check:
    name: Check the release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: check
        run: .github/scripts/check_release_tag.sh "$GITHUB_REF_NAME" main

  publish:
    # The repository has no test suite yet, so the release gate is the tag
    # check and the distribution build, which inspects the wheel and sdist.
    needs: [dist, check]
    name: Publish to PyPI
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token is stored anywhere. Requires a pending publisher configured on
      # PyPI for this project before the first release.
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && needs.check.outputs.publish == 'true'
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Check the built version
        run: |
          version="${TAG#v}"
          for file in dist/*; do
            case "$(basename "$file")" in
              "dj_photon_codecs-$version-"*.whl | "dj_photon_codecs-$version.tar.gz") ;;
              *) echo "::error::$file does not carry version $version"; exit 1 ;;
            esac
          done

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: [publish]
    name: Create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the tag object
        # actions/checkout can store an annotated tag as a lightweight ref.
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "dj-photon-codecs ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
