name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  # The CD workflow runs this as the test gate of a release.
  workflow_call:

concurrency:
  # "CI" rather than github.workflow, which in a run called from CD is "CD":
  # sharing the caller's group is a deadlock, and GitHub cancels the run.
  group: CI-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Ruff
        run: |
          uvx ruff@0.17.6 check --output-format=github src tests
          uvx ruff@0.17.6 format --check src tests

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runs-on: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs takes the version from the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install package
        run: uv sync --locked

      # The database test runs where Docker runs Linux containers (Ubuntu) and
      # skips elsewhere.
      - name: Test package
        run: uv run pytest -ra --durations=20
