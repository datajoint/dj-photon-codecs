[project]
name = "dj-photon-codecs"
description = "DataJoint codec for photon-limited movies with Anscombe transformation and compression"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Dimitri Yatsenko", email = "dimitri@datajoint.com"},
    {name = "Davis Bennett", email = "davis.v.bennett@gmail.com"},
]
keywords = ["datajoint", "photon", "anscombe", "imaging", "codec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # 2.3.4 passes the explicit `context` argument to encode and decode.
    "datajoint>=2.3.4",
    # anscombe-transform 1.0 is a Zarr 3 filter and needs zarr>=3.1.2.
    "zarr>=3.1.2",
    "numpy>=1.25",
    "anscombe-transform>=1.0",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "testcontainers[mysql]>=4.14.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/datajoint/dj-photon-codecs"
Repository = "https://github.com/datajoint/dj-photon-codecs"
Documentation = "https://dj-photon-codecs.readthedocs.io/"
"Bug Tracker" = "https://github.com/datajoint/dj-photon-codecs/issues"

[project.entry-points."datajoint.codecs"]
photon = "dj_photon_codecs:PhotonCodec"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=dj_photon_codecs --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # line too long (handled by formatter)

# The git tag is the single source of truth for the version — mirrors dj-zarr-codecs.
# The build hook writes _version.py, which the package imports, so nothing declares a
# version twice and nothing needs bumping in a pull request.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dj_photon_codecs/_version.py"
